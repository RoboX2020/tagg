# Cloudflare Worker config for the Tagg API (free tier).
name = "tagg-api"
main = "worker.js"
compatibility_date = "2026-10-24"

# Workers KV namespace that stores cards, people, and accounts.
# Existing namespace id (an id is not a secret). For a fresh deploy: `npx wrangler kv namespace create TAGG_KV` and paste the new id.
[[kv_namespaces]]
binding = "KV"
id = "3dd8acfa3bb24dc098dc10da2fe25ef3"

[vars]
GOOGLE_CLIENT_ID = "234788686355-ah0fsgjc8cr8n2h1f9oi0ielbket64jf.apps.googleusercontent.com"

# Secrets (never commit these). Set each with `npx wrangler secret put NAME`:
#   GEMINI_API_KEY    - Ask Tagg answers (free tier key)
#   GITHUB_TOKEN      - optional, raises GitHub profile enrichment rate limit
#   BRIGHTDATA_API_KEY / APIFY_TOKEN - optional LinkedIn enrichment

# Exact in-memory rate limiting without KV writes (KV free tier: 1,000 writes/day). Durable Objects with
# SQLite storage are available on Workers Free; one object per counter key, one request at a time, so counts are exact.
[[durable_objects.bindings]]
name = "RL"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Workers AI: answers "ask Tagg" questions over your own saved people. Included in the Workers Free plan
# (10,000 Neurons/day free, resets 00:00 UTC, over-limit requests fail with an error - never billed on Free).
[ai]
binding = "AI"

# D1 storage migration (branch feat/d1-store, pending Praj's approval - creating the database is an account change):
#   npx wrangler d1 create tagg-store
# then uncomment, paste the database_id, and deploy main = "worker-d1.js" with STORE_MODE per worker/D1-MIGRATION.md:
# [[d1_databases]]
# binding = "DB"
# database_name = "tagg-store"
# database_id = "<from wrangler d1 create>"
